<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRIME SPREE MAYHEM</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Share Tech Mono', monospace;
      background-color: #000;
      color: #0f0;
      scroll-behavior: smooth;
    }

    section {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-size: cover;
      background-position: center;
    }

    #hero {
      background-image: url('0.jpeg');
    }

    #second {
      background-image: url('BELLY%20TELEVISOR.jpg');
      flex-direction: column;
      justify-content: flex-end;
      padding-bottom: 60px;
    }

    .title-overlay {
      color: #ffc600;
      font-size: 4rem;
      letter-spacing: 0.2rem;
      text-shadow: 2px 2px 8px #000;
      text-align: center;
    }

    .subtitle-overlay {
      color: #fff;
      font-size: 1.2rem;
      margin-top: 1rem;
      text-shadow: 1px 1px 4px #000;
    }

    .link-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 30px;
      background: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 900px;
    }

    .link-grid a {
      text-align: center;
      padding: 15px;
      background-color: #111;
      border: 1px solid #0f0;
      border-radius: 5px;
      color: #0f0;
      text-decoration: none;
      font-size: 1.1rem;
      transition: all 0.2s ease;
      text-transform: uppercase;
      box-shadow: 0 0 6px #0f0;
    }

    .link-grid a:hover {
      background-color: #0f0;
      color: #000;
      transform: scale(1.05);
      box-shadow: 0 0 20px #0f0;
    }

    /* Hide fundraising content */
    .hidden {
      display: none;
    }

    footer {
      text-align: center;
      color: #444;
      margin-top: 100px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <section id="hero">
    <div>
      <div class="title-overlay">CRIME SPREE MAYHEM</div>
      <div class="subtitle-overlay">CRIME DOES PAY</div>
    </div>
  </section>

  <section id="second">
    <div class="link-grid">
      <a href="Screenplay.pdf" target="_blank">Script</a>
      <a href="Storyboards.pdf" target="_blank">Storyboards</a>
      <a href="PitchDeck.pdf" target="_blank">Pitch Deck</a>
      <a href="Logline.pdf" target="_blank">Logline</a>
      <a href="Moodboard.pdf" target="_blank">Moodboard</a>
      <a href="Trailer.mp4" target="_blank">Trailer</a>
    </div>
  </section>

  <div class="hidden">
    <!-- Previously visible fundraising content -->
    <h2>Funding Goal: $65,000</h2>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar">$0 Raised</div>
    </div>

    <a href="ReadMe.pdf" class="readme-link" target="_blank">READ ME</a>

    <div class="contribution-buttons">
      <a class="interac-button" href="interac-instructions.html" target="_blank">Interac</a>
      <a class="paypal-button" href="https://www.paypal.com/paypalme/amprc" target="_blank">PayPal</a>
    </div>

    <ul class="contributors" id="contributorList">
      <li><em>No contributions yet.</em></li>
    </ul>
  </div>

  <footer>
    <p><small>Hand-coded by the filmmaker.</small></p>
  </footer>
</body>
</html>
